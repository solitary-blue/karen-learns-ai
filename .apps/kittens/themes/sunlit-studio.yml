name: "sunlit-studio"
label: "Sunlit Studio"

colors:
  white: "#ffffff"
  slate-700: "#334155"
  slate-50: "#f8fafc"
  slate-200: "#e2e8f0"
  sky-50: "#edf8ff"
  mint-50: "#f1fcf8"
  amber-50: "#fff7ed"
  rose-50: "#fff1f2"
  violet-50: "#f7f3ff"
  teal-deep: "#0f766e"
  mint-deep: "#047857"
  amber-deep: "#b45309"
  rose-deep: "#be123c"
  violet-deep: "#7c3aed"
  teal: "#2dd4bf"
  orange: "#fb923c"
  muted: "#f1f5f9"
  muted-fg: "#64748b"

semantics:
  background: white
  foreground: slate-700
  border: slate-200
  input: slate-200
  ring: teal
  primary:
    DEFAULT: teal
    foreground: white
  secondary:
    DEFAULT: muted
    foreground: slate-700
  destructive:
    DEFAULT: "#ef4444"
    foreground: white
  muted:
    DEFAULT: muted
    foreground: muted-fg
  accent:
    DEFAULT: orange
    foreground: white
  popover:
    DEFAULT: white
    foreground: slate-700
  card:
    DEFAULT: slate-50
    foreground: slate-700
  bold: slate-700
  headers:
    color: slate-700
    h1:
      color: teal

fonts:
  title: "system-ui, -apple-system, sans-serif"
  main: "system-ui, -apple-system, sans-serif"

components:
  bullets:
    color: teal
    size: "0.54rem"
    radius: "999px"
    offsetY: "0.74em"
    shadow: "none"
  callouts:
    radius: "1.25rem"
    titleBackground: "transparent"
    titleDividerWidth: "0"
    titleDividerColor: "transparent"
    kittenOpacity: "0.9"
    types:
      info:
        surface: sky-50
        border: sky-50
        title: "#0f70ba"
      success:
        surface: mint-50
        border: mint-50
        title: mint-deep
      warning:
        surface: amber-50
        border: amber-50
        title: amber-deep
      danger:
        surface: rose-50
        border: rose-50
        title: rose-deep
      example:
        surface: violet-50
        border: violet-50
        title: violet-deep
