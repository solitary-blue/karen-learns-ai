name: "dracula"
label: "Dracula Theme"

# Named Palette
colors:
  background: "#282a36"
  currentLine: "#44475a"
  foreground: "#f8f8f2"
  comment: "#6272a4"
  cyan: "#8be9fd"
  green: "#50fa7b"
  orange: "#ffb86c"
  pink: "#ff79c6"
  purple: "#bd93f9"
  red: "#ff5555"
  yellow: "#f1fa8c"

# Semantics (Hierarchical)
semantics:
  background: background
  foreground: foreground
  border: currentLine
  input: currentLine
  ring: purple
  primary:
    DEFAULT: purple
    foreground: foreground
  secondary:
    DEFAULT: currentLine
    foreground: foreground
  destructive:
    DEFAULT: red
    foreground: foreground
  muted:
    DEFAULT: comment
    foreground: foreground
  accent:
    DEFAULT: pink
    foreground: foreground
  popover:
    DEFAULT: background
    foreground: foreground
  card:
    DEFAULT: background
    foreground: foreground
  bold: orange
  headers:
    color: pink
    h1:
      color: purple

# Fonts
fonts:
  title: "system-ui, -apple-system, sans-serif"
  main: "system-ui, -apple-system, sans-serif"

components:
  bullets:
    color: green
    size: "0.56rem"
    radius: "999px"
    offsetY: "0.74em"
    shadow: "0 0 0.45rem rgba(80, 250, 123, 0.34)"
  callouts:
    radius: "0.9rem"
    shadow: "0 12px 28px rgba(0, 0, 0, 0.28)"
    titleBackground: "rgba(68, 71, 90, 0.7)"
    titleBorderWidth: "0"
    titleDividerWidth: "0"
    titleDividerColor: "transparent"
    kittenOpacity: "0.88"
    types:
      info:
        surface: "#2d3748"
        border: currentLine
        title: cyan
      success:
        surface: "#283330"
        border: currentLine
        title: green
      warning:
        surface: "#332b26"
        border: currentLine
        title: yellow
      danger:
        surface: "#332626"
        border: currentLine
        title: red
      example:
        surface: "#2f2742"
        border: currentLine
        title: purple

# Mascot Overrides
mascots:
  header: ['suit-arms-crossed']
  callouts:
    tip: ['shows-book']
    note: ['excited-chemist']
