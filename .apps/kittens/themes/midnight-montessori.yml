name: "midnight-montessori"
label: "Midnight Montessori"

colors:
  deep-slate: "#0f172a"
  slate-card: "#1e293b"
  slate-50: "#f8fafc"
  slate-border: "#334155"
  blue: "#3b82f6"
  red: "#ef4444"
  emerald: "#34d399"
  amber: "#f59e0b"
  rose: "#fb7185"
  violet: "#a78bfa"
  muted-gray: "#475569"
  muted-fg: "#94a3b8"
  indigo: "#4f46e5"

semantics:
  background: deep-slate
  foreground: slate-50
  border: slate-border
  input: slate-border
  ring: blue
  primary:
    DEFAULT: blue
    foreground: slate-50
  secondary:
    DEFAULT: slate-border
    foreground: slate-50
  destructive:
    DEFAULT: red
    foreground: slate-50
  muted:
    DEFAULT: muted-gray
    foreground: muted-fg
  accent:
    DEFAULT: indigo
    foreground: slate-50
  popover:
    DEFAULT: slate-card
    foreground: slate-50
  card:
    DEFAULT: slate-card
    foreground: slate-50
  bold: slate-50
  headers:
    color: slate-50
    h1:
      color: blue

fonts:
  title: '"Outfit", sans-serif'
  main: '"Lexend", sans-serif'

components:
  bullets:
    color: blue
    size: "0.58rem"
    radius: "999px"
    offsetY: "0.72em"
    shadow: "0 0 0.55rem rgba(59, 130, 246, 0.34)"
  callouts:
    radius: "1rem"
    shadow: "0 18px 40px rgba(15, 23, 42, 0.22)"
    backdropFilter: "blur(12px)"
    titleBackground: "transparent"
    titleBorderWidth: "0"
    titleDividerWidth: "0"
    titleDividerColor: "transparent"
    kittenOpacity: "0.82"
    types:
      info:
        surface: "rgba(59, 130, 246, 0.1)"
        border: "rgba(59, 130, 246, 0.45)"
        title: "#60a5fa"
      success:
        surface: "rgba(52, 211, 153, 0.1)"
        border: "rgba(52, 211, 153, 0.45)"
        title: "#6ee7b7"
      warning:
        surface: "rgba(245, 158, 11, 0.1)"
        border: "rgba(245, 158, 11, 0.45)"
        title: "#fbbf24"
      danger:
        surface: "rgba(251, 113, 133, 0.1)"
        border: "rgba(251, 113, 133, 0.45)"
        title: "#fda4af"
      example:
        surface: "rgba(167, 139, 250, 0.1)"
        border: "rgba(167, 139, 250, 0.45)"
        title: "#c4b5fd"
    variants:
      note:
        surface: "rgba(244, 63, 94, 0.16)"
        border: "rgba(244, 63, 94, 0.62)"
        title: "#fda4af"
      abstract:
        surface: "rgba(167, 139, 250, 0.1)"
        border: "rgba(167, 139, 250, 0.45)"
        title: "#c4b5fd"
      example:
        surface: "rgba(167, 139, 250, 0.1)"
        border: "rgba(167, 139, 250, 0.45)"
        title: "#c4b5fd"
      todo:
        surface: "rgba(52, 211, 153, 0.1)"
        border: "rgba(52, 211, 153, 0.45)"
        title: "#6ee7b7"
      question:
        surface: "rgba(245, 158, 11, 0.1)"
        border: "rgba(245, 158, 11, 0.45)"
        title: "#fbbf24"
      warning:
        surface: "rgba(245, 158, 11, 0.1)"
        border: "rgba(245, 158, 11, 0.45)"
        title: "#fbbf24"
      failure:
        surface: "rgba(251, 113, 133, 0.1)"
        border: "rgba(251, 113, 133, 0.45)"
        title: "#fda4af"
      bug:
        surface: "rgba(251, 113, 133, 0.1)"
        border: "rgba(251, 113, 133, 0.45)"
        title: "#fda4af"

googleFonts: "Lexend:wght@300;400;500;600;700&family=Outfit:wght@400;600;700"
