name: "parchment-ink"
label: "Parchment & Ink"

colors:
  parchment: "#fcf9f2"
  ink: "#1a1a1a"
  card-bg: "#f5f1e8"
  warm-border: "#dcd3bc"
  deep-red: "#991b1b"
  deep-blue: "#1e3a8a"
  forest: "#3a6e4a"
  umber: "#8b5e3c"
  muted: "#c8bfa8"
  muted-fg: "#6b6355"

semantics:
  background: parchment
  foreground: ink
  border: warm-border
  input: warm-border
  ring: deep-red
  primary:
    DEFAULT: deep-red
    foreground: parchment
  secondary:
    DEFAULT: warm-border
    foreground: ink
  destructive:
    DEFAULT: "#b91c1c"
    foreground: parchment
  muted:
    DEFAULT: muted
    foreground: muted-fg
  accent:
    DEFAULT: deep-blue
    foreground: parchment
  popover:
    DEFAULT: parchment
    foreground: ink
  card:
    DEFAULT: card-bg
    foreground: ink
  bold: ink
  headers:
    color: ink
    h1:
      color: deep-red

fonts:
  title: "Georgia, Cambria, 'Times New Roman', serif"
  main: "'Avenir Next', Avenir, system-ui, sans-serif"

components:
  bullets:
    color: forest
    size: "0.54rem"
    radius: "999px"
    offsetY: "0.74em"
    shadow: "none"
  callouts:
    radius: "0.75rem"
    shadow: "inset 0 1px 4px rgba(0, 0, 0, 0.08), 0 2px 4px rgba(0, 0, 0, 0.04)"
    titleBackground: "transparent"
    titleDividerWidth: "1px"
    titleDividerColor: "rgba(26, 26, 26, 0.12)"
    kittenOpacity: "0.9"
    types:
      info:
        surface: "#eef0f6"
        border: "#3a5090"
        title: "#2e4478"
      success:
        surface: "#eef4ee"
        border: forest
        title: "#2a5a3a"
      warning:
        surface: "#f6f0e4"
        border: "#a07030"
        title: "#7a5420"
      danger:
        surface: "#f6eeee"
        border: "#903a3a"
        title: "#782e2e"
      example:
        surface: "#f2eef6"
        border: "#5a4080"
        title: "#4a3468"
