name: "dusk-gradient"
label: "Dusk Gradient"

colors:
  dusk-bg: "#1a1040"
  dusk-card: "#2a1848"
  dusk-fg: "#f0e8e0"
  dusk-border: "#3a2850"
  dusk-plum: "#3a1838"
  peach: "#f0a070"
  purple: "#c084fc"
  sky: "#8ab4f0"
  mint: "#80daa8"
  blush: "#f09098"
  lavender: "#d0a8ff"
  muted: "#4a3060"
  muted-fg: "#b0a0c0"

semantics:
  background: dusk-bg
  foreground: dusk-fg
  border: dusk-border
  input: dusk-border
  ring: peach
  primary:
    DEFAULT: peach
    foreground: dusk-bg
  secondary:
    DEFAULT: dusk-border
    foreground: dusk-fg
  destructive:
    DEFAULT: "#f07080"
    foreground: dusk-fg
  muted:
    DEFAULT: muted
    foreground: muted-fg
  accent:
    DEFAULT: purple
    foreground: dusk-fg
  popover:
    DEFAULT: dusk-card
    foreground: dusk-fg
  card:
    DEFAULT: dusk-card
    foreground: dusk-fg
  bold: dusk-fg
  headers:
    color: dusk-fg
    h1:
      color: peach

fonts:
  title: '"Fraunces", serif'
  main: '"Averia Libre", cursive'

components:
  bullets:
    color: peach
    size: "0.54rem"
    radius: "999px"
    offsetY: "0.74em"
    shadow: "0 0 0.5rem rgba(240, 160, 112, 0.3)"
  callouts:
    radius: "1.5rem"
    shadow: "0 4px 20px rgba(160, 80, 60, 0.06), 0 12px 40px rgba(80, 30, 100, 0.1)"
    backdropFilter: "blur(14px)"
    titleBackground: "transparent"
    titleDividerWidth: "0"
    titleDividerColor: "transparent"
    kittenOpacity: "0.88"
    types:
      info:
        surface: "rgba(26, 26, 58, 0.4)"
        border: "rgba(106, 154, 224, 0.4)"
        title: sky
      success:
        surface: "rgba(26, 42, 26, 0.4)"
        border: "rgba(96, 192, 144, 0.4)"
        title: mint
      warning:
        surface: "rgba(42, 26, 16, 0.4)"
        border: "rgba(240, 160, 112, 0.4)"
        title: "#f0b888"
      danger:
        surface: "rgba(42, 16, 16, 0.4)"
        border: "rgba(240, 112, 128, 0.4)"
        title: blush
      example:
        surface: "rgba(26, 16, 40, 0.4)"
        border: "rgba(192, 132, 252, 0.4)"
        title: lavender

googleFonts: "Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&family=Averia+Libre:wght@400;700"
