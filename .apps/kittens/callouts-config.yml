# Obsidian Callout Configuration
# Schema:
#   type: string (unique identifier)
#   title: string (default title)
#   icon: string (lucide icon name)
#   aliases: string[] (optional alternate names)
#   kittens: string|string[] (optional mascot override)
#   minHeight: string (optional minimum height for mascot callouts)

callouts:
  - type: note
    title: Note
    icon: FileText

  - type: abstract
    title: Abstract
    icon: List
    aliases: [summary, tldr]

  - type: info
    title: Info
    icon: Info

  - type: todo
    title: Todo
    icon: CheckCircle

  - type: tip
    title: Tip
    icon: Flame
    aliases: [hint, important]
    kittens: [proud-book, shows-book]

  - type: success
    title: Success
    icon: CheckCircle
    aliases: [check, done]
    kittens: excited-chemist

  - type: question
    title: Question
    icon: HelpCircle
    aliases: [help, faq]

  - type: warning
    title: Warning
    icon: AlertTriangle
    aliases: [caution, attention]
    kittens: concerned-chemist

  - type: failure
    title: Failure
    icon: XCircle
    aliases: [fail, missing]

  - type: danger
    title: Danger
    icon: Zap
    aliases: [error]

  - type: bug
    title: Bug
    icon: Bug

  - type: example
    title: Example
    icon: List
    kittens: suit-arms-crossed

  - type: quote
    title: Quote
    icon: Quote
    aliases: [cite]
